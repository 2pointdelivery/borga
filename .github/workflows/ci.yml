name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any high or critical advisory in what ships (production dependencies).
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          SESSION_SECRET: ci-only-not-a-secret-0123456789abcdef
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
