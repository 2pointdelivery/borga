# Borga on a single VM (Oracle Cloud Always Free, Ampere A1 / Ubuntu works).
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
# Container logs are capped so they cannot fill the free-tier disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: borga
      MYSQL_USER: borga
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    # Tables are created by the "migrate" service below (one source of truth: the files in drizzle/), not by an init script.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Not published to the host: only the app container can reach it.

  # Runs once on every "up": creates or upgrades the tables, then exits. The app starts only if it succeeded, so a
  # failed migration (for example duplicate emails) stops the update instead of running new code on an old schema.
  # Check the result with: docker compose logs migrate
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: borga-app:local
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://borga:${MYSQL_PASSWORD}@db:3306/borga
    command: ["node", "scripts/migrate.mjs"]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: borga-app:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://borga:${MYSQL_PASSWORD}@db:3306/borga
    # Loopback only: Caddy is the public entrypoint; the cron timer calls this port directly.
    ports:
      - "127.0.0.1:13000:13000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  caddydata:
  caddyconfig:
